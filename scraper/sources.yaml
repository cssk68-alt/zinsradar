# Quellenliste fuer den Tagesgeld-Aggregator.
#
# WICHTIG / STATUS DER SELEKTOREN
# Die Werte unter `felder:` und `container_selector:` stammen aus einer
# LLM-Recherche und sind UNGEPRUEFT. Sie sind HINWEISE, keine Wahrheit.
# Der Extraktor behandelt sie entsprechend: schlaegt Stufe 2 fehl oder
# liefert 0 Treffer, faellt er auf eine generische Heuristik und danach
# auf den LLM-Fallback zurueck. Ein falscher Selektor kostet Qualitaet,
# aber bricht die Pipeline nicht.
#
# Pruefe den Ist-Zustand jederzeit mit:  python scraper/bootstrap.py
# Ergebnis landet in docs/quellen_status.md
#
# Feldbedeutung:
#   url                   Einstiegsseite
#   land                  ISO-2 des Landes, dem die Quelle zugeordnet ist.
#                         Das massgebliche Land pro Angebot ist spaeter
#                         `einlagensicherung_land`, nicht dieses Feld.
#   sprache               fuer Zahlenformat-Heuristik (Komma vs. Punkt)
#   typ                   plattform | portal | bank
#   rendering             static_html | js_required  (js_required -> Playwright)
#   json_endpoint         Stufe-1-Kandidat, darf null sein
#   robots_txt_erlaubt    NUR Hinweis. Massgeblich ist die live geholte robots.txt.
#   bot_schutz            Hinweis fuer die Fehlerdiagnose
#   container_selector    Stufe 2, kommaseparierte CSS-Alternativen erlaubt
#   felder                Stufe 2. Wert "literal:'X'" setzt einen Festwert.
#   fallstricke           Freitext, wird in quellen_status.md mitgedruckt

version: 1

quellen:
  - url: "https://www.weltsparen.de/tagesgeld/"
    land: "DE"
    sprache: "de"
    typ: "plattform"
    rendering: "js_required"
    json_endpoint: "https://www.weltsparen.de/api/v1/products/overnight"
    robots_txt_erlaubt: "ja"
    bot_schutz: "ja"
    container_selector: "div.product-card-container, div[data-testid='product-card']"
    felder:
      bank: ".bank-name, [data-testid='bank-name']"
      zinssatz: ".interest-rate, [data-testid='interest-rate']"
      zinstyp: ".rate-type"
      aktionsdauer_monate: ".bonus-duration"
      folgezins: ".standard-rate"
      mindestanlage: ".min-deposit"
      hoechstanlage: ".max-deposit"
      einlagensicherung_land: ".deposit-protection-country"
    fallstricke: "Dynamisches SPA-Rendering via Next.js; API-Endpoints nutzen Cloudflare-Bot-Protection."

